[package]
name = "nest-drift"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nest-drift"
path = "src/main.rs"

[lib]
name = "nest_drift"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
colored = "2"
serde_yaml = "0.9"
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "1"

[profile.release]
lto = true
strip = true
