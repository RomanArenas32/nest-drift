name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            pre: rustup target add aarch64-apple-darwin
            build: napi build --platform --release --target aarch64-apple-darwin

          - os: macos-latest
            target: x86_64-apple-darwin
            pre: rustup target add x86_64-apple-darwin
            build: napi build --platform --release --target x86_64-apple-darwin

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: napi build --platform --release

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: napi build --platform --release

    runs-on: ${{ matrix.os }}

    env:
      # Disable HTTP/2 multiplexing — fixes curl [16] errors on Windows runners
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_NET_RETRY: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install napi-rs cli
        run: npm install -g @napi-rs/cli

      - name: Add Rust target
        if: matrix.pre
        run: ${{ matrix.pre }}

      - name: Build native binding
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: '*.node'

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all bindings
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Copy bindings to package root
        run: cp artifacts/*.node .

      - name: List bindings
        run: ls -la *.node

      - name: Publish
        run: npm publish --access public --provenance
